name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bun run check:pack
